name: Trigger Codemagic Build

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*.*.*"

jobs:
  trigger-codemagic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.11.0

      - name: Install dependencies
        run: npm install

      - name: Determine build type
        id: build-type
        run: |
          if [[ "${{ github.ref }}" == "refs/tags/"* ]]; then
            echo "build_type=release" >> $GITHUB_OUTPUT
            echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          else
            echo "build_type=debug" >> $GITHUB_OUTPUT
          fi

      - name: Trigger Codemagic Android build
        if: steps.build-type.outputs.build_type == 'debug'
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            -H "x-api-key: ${{ secrets.CODEMAGIC_API_KEY }}" \
            -d '{
              "workflowId": "${{ secrets.CODEMAGIC_ANDROID_DEBUG_WORKFLOW_ID }}",
              "branch": "main",
              "globals": {
                "env": {
                  "PUBLISHABLE": true
                }
              }
            }' \
            https://api.codemagic.io/builds

      - name: Trigger Codemagic Release builds (on tag)
        if: steps.build-type.outputs.build_type == 'release'
        run: |
          echo "Triggering Android release build..."
          curl -X POST \
            -H "Content-Type: application/json" \
            -H "x-api-key: ${{ secrets.CODEMAGIC_API_KEY }}" \
            -d '{
              "workflowId": "${{ secrets.CODEMAGIC_ANDROID_RELEASE_WORKFLOW_ID }}",
              "branch": "build",
              "tags": ["${{ steps.build-type.outputs.tag }}"]
            }' \
            https://api.codemagic.io/builds

          echo "Triggering iOS release build..."
          curl -X POST \
            -H "Content-Type: application/json" \
            -H "x-api-key: ${{ secrets.CODEMAGIC_API_KEY }}" \
            -d '{
              "workflowId": "${{ secrets.CODEMAGIC_IOS_RELEASE_WORKFLOW_ID }}",
              "branch": "build",
              "tags": ["${{ steps.build-type.outputs.tag }}"]
            }' \
            https://api.codemagic.io/builds
